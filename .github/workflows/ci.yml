name: CI

# The fast loop: relay tests, client tests, the integration lane, and §22.3's
# dependency checks, on every push to main and every PR. Also builds the relay
# image and checks it answers, because a Dockerfile nobody builds is a document
# rather than a deliverable — note it is BUILT here and never pushed, which is
# what keeps `latest` meaning the last release rather than the last commit.
# Publishing lives in release.yml, on tag. Cross-platform client builds are
# M1.5 (ROJ-52) and not here yet.
# Target: under 5 minutes — every job runs in parallel except integration.
on:
  push:
    branches: [main]
  pull_request:
  # A vulnerability database changes without anyone touching this repository, so a
  # scan that only runs on commits stops protecting a quiet week. Mondays, early.
  schedule:
    - cron: "17 6 * * 1"

# A new push to a PR makes the in-flight run obsolete; don't pay for it twice.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned so local and CI agree (ROJ-37 acceptance criterion).
  #
  # The ticket says "OTP 25". That is a misreading of `elixir --version`, whose
  # "(compiled with Erlang/OTP 25)" line reports the OTP release the Elixir BUILD was
  # made against — not the runtime. The development runtime here is OTP 27
  # (erlang:system_info(otp_release)), so 27 is the pin that actually makes local and
  # CI agree. Do not "correct" this back to 25 without checking the runtime first.
  ELIXIR_VERSION: "1.18"
  OTP_VERSION: "27"

jobs:
  # ---------------------------------------------------------------------------
  relay:
    name: relay · Elixir
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: skulkd
    steps:
      - uses: actions/checkout@v7

      - name: Set up Erlang/OTP + Elixir
        uses: erlef/setup-beam@v1
        id: beam
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      # actions/cache paths are workspace-relative, not job-working-directory-relative.
      - name: Cache deps and _build
        uses: actions/cache@v6
        with:
          path: |
            skulkd/deps
            skulkd/_build
          key: mix-${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-elixir${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('skulkd/mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-elixir${{ steps.beam.outputs.elixir-version }}-

      - run: mix deps.get

      - name: mix format --check-formatted
        run: mix format --check-formatted

      # No exclusions any more: ROJ-32 implemented Skulkd.Protocol.validate/3, so the
      # relay's half of the golden corpus passes. The "must still be red" step that
      # used to live here was deleted in the same commit, exactly as its own failure
      # message instructed — that handoff is what it was built for. The client job's
      # twin retired the same way one ticket later.
      - name: mix test
        run: mix test

  # ---------------------------------------------------------------------------
  client:
    name: client · Go
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # Read from go.mod so the toolchain can never drift from the repo's own pin.
          go-version-file: go.mod
          # go.sum exists as of ROJ-33 (the client gained a WebSocket library), so the
          # cache keys off the exact dependency versions rather than the module file.
          cache-dependency-path: go.sum

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needs to run on:"
            echo "$unformatted"
            exit 1
          fi

      - run: go vet ./...

      - run: go build ./...

      # No skips any more: ROJ-33 implemented internal/protocol, so the client's half
      # of the golden corpus passes. The "must still be red" step that used to live
      # here was deleted in the same commit, exactly as its own failure message
      # instructed — the second and last time that handoff fires. Both languages now
      # agree on all 59 vectors, which is design A13's central claim finally enforced
      # rather than promised.
      # -race because this ticket's code is concurrent by nature (a session reader,
      # an event pump, a command loop) and the detector found three real bugs during
      # ROJ-33 that the plain run did not: a production data race on the exit code,
      # a test harness racing the writer it read, and unsynchronised state in the
      # fake relay. The cost is a couple of seconds.
      # `-X` is silently a no-op when it names a symbol that does not exist, so
      # renaming or moving cmd/skulk/main.go's `Version` would send every release
      # back to 0.0.0-dev with no error anywhere — not at build, not at release,
      # not until somebody reports a bug against a version that means nothing.
      # This is the only thing that notices.
      - name: The version is injectable at build time
        run: |
          go build -ldflags "-X main.Version=9.9.9-ldflags-check" -o /tmp/skulk-version ./cmd/skulk
          got="$(/tmp/skulk-version --version)"
          echo "$got"
          if [ "$got" != "skulk 9.9.9-ldflags-check" ]; then
            echo "::error::-ldflags '-X main.Version' did not take. Did Version move or get renamed? .goreleaser.yaml names it."
            exit 1
          fi

      - name: go test
        run: go test -race ./...

  # ---------------------------------------------------------------------------
  # §22.3: "Run dependency vulnerability and license checks in CI." Its own job
  # rather than steps bolted onto relay/client, because a red lane here means a
  # dependency moved, not that the code broke — and that distinction is worth a
  # name on the checks list.
  #
  # Every check FAILS the build. A warning nobody has to act on is a warning
  # nobody acts on; §22.3 asks for checks, and a check that cannot say no isn't
  # one.
  #
  # Tool versions are pinned and mirrored in Taskfile.yml (`task audit` runs
  # exactly these four commands). Change both together.
  audit:
    name: audit · dependencies, both languages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOVULNCHECK: v1.7.0
      GO_LICENSES: v1.6.0
      GO_LICENSES_ALLOWED: MIT,ISC,BSD-3-Clause
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Erlang/OTP + Elixir
        uses: erlef/setup-beam@v1
        id: beam
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache deps and _build
        uses: actions/cache@v6
        with:
          path: |
            skulkd/deps
            skulkd/_build
          key: mix-${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-elixir${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('skulkd/mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-elixir${{ steps.beam.outputs.elixir-version }}-

      # Symbol-level scanning: a vulnerability in a package we import but never
      # call does not fail this. The first run of this check found fourteen that
      # DID reach called code, all in the standard library, and the fix was the
      # Go bump in this same ticket.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK }} ./...

      # Go modules carry no license metadata, so this classifies by reading
      # LICENSE files. The Elixir side does not need a tool for the same job —
      # see skulkd/lib/mix/tasks/licenses.check.ex for why.
      - name: go-licenses
        run: go run github.com/google/go-licenses@${{ env.GO_LICENSES }} check ./... --allowed_licenses=${{ env.GO_LICENSES_ALLOWED }}

      - name: mix deps.get
        working-directory: skulkd
        run: mix deps.get

      - name: mix deps.audit
        working-directory: skulkd
        run: mix deps.audit

      - name: mix licenses.check
        working-directory: skulkd
        run: mix licenses.check

  # ---------------------------------------------------------------------------
  # §24's Dockerfile, built and run on every PR.
  #
  # It is here rather than with the publishing workflow (ROJ-53) because the ways
  # this breaks are silent: a dependency that needs a build tool the runtime image
  # does not have, a base image that moved, a release that starts and then exits.
  # None of them show up in `mix test`, and all of them show up at the worst
  # possible moment if the first build is the one that publishes a tag.
  #
  # /healthz is the whole assertion. It proves the release booted, Bandit is
  # listening on the configured address, and the plug pipeline answers — which is
  # everything the image is responsible for. What runs BEHIND that endpoint is the
  # relay and integration suites' job, not this one's.
  #
  # arm64, because that is the only architecture release.yml publishes — an image
  # job that tested a platform nobody runs would be worse than none.
  image:
    name: image · the relay builds and answers
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: docker build
        uses: docker/build-push-action@v6
        with:
          load: true
          tags: skulkd:ci
          platforms: linux/arm64
          cache-from: type=gha
          # Written only from main. GitHub scopes caches by branch, so a release
          # tag reads what main produced and nothing a pull request wrote — which
          # is both the security property and the reason a PR writing here would
          # be wasted space.
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max' || '' }}

      - name: The image boots and /healthz answers
        run: |
          docker run -d --name skulkd-ci -p 4000:4000 skulkd:ci
          for _ in $(seq 1 30); do
            if curl -fsS --max-time 2 http://127.0.0.1:4000/healthz; then
              echo
              echo "relay answered"
              exit 0
            fi
            sleep 1
          done
          echo "::error::the image never answered /healthz within 30s"
          docker logs skulkd-ci
          exit 1

      # The image runs as an unprivileged user (§20: nothing is written to disk,
      # so nothing needs root). Asserted rather than assumed, because a base image
      # change that dropped the USER line would go unnoticed otherwise.
      - name: It is not running as root
        run: |
          user="$(docker exec skulkd-ci id -un)"
          echo "running as: $user"
          [ "$user" = "skulkd" ] || { echo "::error::expected user skulkd, got $user"; exit 1; }

      # The relay holds no keys and issues no credentials, so its image has no
      # reason to carry an environment variable that looks like one — nor a
      # default relay address, which A10 refuses to ship precisely because a
      # one-liner installer beside an unauthenticated relay advertises it.
      - name: It carries no credentials and no default relay address
        run: |
          if docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' skulkd:ci \
             | grep -Ei '^(SKULK_SERVER|.*(PASSWORD|PASSPHRASE|SECRET|TOKEN|CREDENTIAL|API_?KEY).*)=' ; then
            echo "::error::the image ships an environment variable it should not"
            exit 1
          fi
          echo "clean"

  # ---------------------------------------------------------------------------
  # ExUnit drives everything (design A14): the relay boots in-process and real
  # `skulk --headless` binaries are driven through Ports. Runs one seed test until
  # ROJ-35 lands the suite proper.
  integration:
    name: integration · ExUnit drives the Go client
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [relay, client]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Erlang/OTP + Elixir
        uses: erlef/setup-beam@v1
        id: beam
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # Same key as the relay job, so this job restores that job's cache instead of
      # recompiling every dependency from scratch.
      - name: Cache deps and _build
        uses: actions/cache@v6
        with:
          path: |
            skulkd/deps
            skulkd/_build
          key: mix-${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-elixir${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('skulkd/mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-elixir${{ steps.beam.outputs.elixir-version }}-

      - name: Build the client
        run: go build -o bin/skulk ./cmd/skulk

      - name: Build the protocol oracle
        run: go build -o bin/protocol-oracle ./cmd/protocol-oracle

      - name: mix deps.get
        working-directory: skulkd
        run: mix deps.get

      - name: mix test.integration
        working-directory: skulkd
        env:
          # ROJ-35's harness reads this rather than building the client itself.
          SKULK_BIN: ${{ github.workspace }}/bin/skulk
          SKULK_ORACLE_BIN: ${{ github.workspace }}/bin/protocol-oracle
        run: mix test.integration
