name: CI

# The fast loop only: relay tests, client tests, and the integration lane, on every
# push to main and every PR. Cross-platform build matrix, release artifacts, and the
# Docker relay image are M5 (ROJ-38+) and deliberately not here. Target: under 5 minutes.
on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR makes the in-flight run obsolete; don't pay for it twice.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned so local and CI agree (ROJ-37 acceptance criterion).
  #
  # The ticket says "OTP 25". That is a misreading of `elixir --version`, whose
  # "(compiled with Erlang/OTP 25)" line reports the OTP release the Elixir BUILD was
  # made against — not the runtime. The development runtime here is OTP 27
  # (erlang:system_info(otp_release)), so 27 is the pin that actually makes local and
  # CI agree. Do not "correct" this back to 25 without checking the runtime first.
  ELIXIR_VERSION: "1.18"
  OTP_VERSION: "27"

jobs:
  # ---------------------------------------------------------------------------
  relay:
    name: relay · Elixir
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: skulkd
    steps:
      - uses: actions/checkout@v7

      - name: Set up Erlang/OTP + Elixir
        uses: erlef/setup-beam@v1
        id: beam
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      # actions/cache paths are workspace-relative, not job-working-directory-relative.
      - name: Cache deps and _build
        uses: actions/cache@v6
        with:
          path: |
            skulkd/deps
            skulkd/_build
          key: mix-${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-elixir${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('skulkd/mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-elixir${{ steps.beam.outputs.elixir-version }}-

      - run: mix deps.get

      - name: mix format --check-formatted
        run: mix format --check-formatted

      # No exclusions any more: ROJ-32 implemented Skulkd.Protocol.validate/3, so the
      # relay's half of the golden corpus passes. The "must still be red" step that
      # used to live here was deleted in the same commit, exactly as its own failure
      # message instructed — that handoff is what it was built for. The client job's
      # twin retired the same way one ticket later.
      - name: mix test
        run: mix test

  # ---------------------------------------------------------------------------
  client:
    name: client · Go
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # Read from go.mod so the toolchain can never drift from the repo's own pin.
          go-version-file: go.mod
          # go.sum exists as of ROJ-33 (the client gained a WebSocket library), so the
          # cache keys off the exact dependency versions rather than the module file.
          cache-dependency-path: go.sum

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needs to run on:"
            echo "$unformatted"
            exit 1
          fi

      - run: go vet ./...

      - run: go build ./...

      # No skips any more: ROJ-33 implemented internal/protocol, so the client's half
      # of the golden corpus passes. The "must still be red" step that used to live
      # here was deleted in the same commit, exactly as its own failure message
      # instructed — the second and last time that handoff fires. Both languages now
      # agree on all 59 vectors, which is design A13's central claim finally enforced
      # rather than promised.
      - name: go test
        run: go test ./...

  # ---------------------------------------------------------------------------
  # ExUnit drives everything (design A14): the relay boots in-process and real
  # `skulk --headless` binaries are driven through Ports. Runs one seed test until
  # ROJ-35 lands the suite proper.
  integration:
    name: integration · ExUnit drives the Go client
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [relay, client]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Erlang/OTP + Elixir
        uses: erlef/setup-beam@v1
        id: beam
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # Same key as the relay job, so this job restores that job's cache instead of
      # recompiling every dependency from scratch.
      - name: Cache deps and _build
        uses: actions/cache@v6
        with:
          path: |
            skulkd/deps
            skulkd/_build
          key: mix-${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-elixir${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('skulkd/mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-elixir${{ steps.beam.outputs.elixir-version }}-

      - name: Build the client
        run: go build -o bin/skulk ./cmd/skulk

      - name: mix deps.get
        working-directory: skulkd
        run: mix deps.get

      - name: mix test.integration
        working-directory: skulkd
        env:
          # ROJ-35's harness reads this rather than building the client itself.
          SKULK_BIN: ${{ github.workspace }}/bin/skulk
        run: mix test.integration
