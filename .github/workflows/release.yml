name: Release

# A tag publishes the relay image. Nothing else does — ci.yml builds the image on
# every PR and throws it away, which is what keeps `latest` meaning the last
# RELEASE rather than the last commit.
#
# One tag produces BOTH halves — the client, via goreleaser, and the relay image
# — from the same commit. That pairing is the point: M2 and M3 are protocol
# bumps, and a stale client against a new relay gets
# `unsupported_protocol_version` and a closed connection, which is the protocol
# working correctly and looks exactly like the app being broken.
on:
  push:
    tags: ["v*"]
  # Publishes as 0.0.0-dryrun, which contains a hyphen and so can never become
  # `latest` under the rule below. For rehearsing a release before tagging one,
  # since a tag cannot be taken back. Delete the package version afterwards.
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  # ---------------------------------------------------------------------------
  # The client: macOS binaries, a GitHub release, and the Homebrew cask.
  #
  # Configured in .goreleaser.yaml. On a manual dispatch this builds a snapshot
  # and publishes nothing, which is the rehearsal for a tag that cannot be taken
  # back.
  #
  # NEEDS A SECRET the repository does not have by default: HOMEBREW_TAP_TOKEN, a
  # fine-grained PAT with Contents: read and write on roeeyn/homebrew-tap.
  # GITHUB_TOKEN is scoped to THIS repository and cannot push to another one.
  #
  # That token EXPIRES. When a release fails at the cask step with a 401 or 403,
  # this is the first thing to check.
  client:
    name: release · the skulk client
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # Job-level permissions replace the workflow's rather than adding to them,
      # and creating a GitHub release needs write. No packages here — that is the
      # relay job's business.
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # goreleaser builds the changelog from history; a shallow clone has none.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: ${{ github.event_name == 'push' && 'release --clean' || 'build --snapshot --clean' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  # ---------------------------------------------------------------------------
  publish:
    name: publish · ghcr.io/roeeyn/skulkd
    # linux/arm64 ONLY, and this runner builds it natively.
    #
    # The relay is for Apple Silicon MacBooks right now, and Docker there runs an
    # arm64 Linux VM — so amd64 would be the emulated one on every machine that
    # matters. Adding amd64 back means a second job pushing by digest and a
    # manifest merge, because this project cannot be cross-built under QEMU: see
    # the Dockerfile.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the version and which tags it gets
        id: meta
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0-dryrun"
          fi

          tags="ghcr.io/roeeyn/skulkd:$version"

          # `latest` follows stable releases only. Semver spells a prerelease with
          # a hyphen, and pointing `latest` at a release candidate would hand it to
          # everyone who typed no tag at all.
          case "$version" in
            *-*) echo "prerelease $version — leaving :latest where it is" ;;
            *)   tags="$tags,ghcr.io/roeeyn/skulkd:latest" ;;
          esac

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "publishing: $tags"

      - uses: docker/build-push-action@v6
        with:
          push: true
          platforms: linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          # ci.yml writes this cache on every push to main, so a release from main
          # is mostly an export rather than a full Elixir dependency compile.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Package visibility is a manual step, once
        run: |
          cat <<'EOF'
          ::notice::A GHCR package is created PRIVATE regardless of the repository.
          After the first release, set it public at
          https://github.com/users/roeeyn/packages/container/skulkd/settings
          or `docker pull` fails for everyone but the owner.
          EOF
